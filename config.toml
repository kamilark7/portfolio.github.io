# Page settings

baseURL = "https://kamilark7.github.io/portfolio.github.io/"
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = true
disableKinds = ["taxonomy", "term", "rss", "sitemap", "404"]
theme = "hugo-theme-doors"

[caches]
  [caches.images]
    dir = ':cacheDir/images'

# Settings shared by all languages
[params]
googleTagManager = "GTM-xxxxxxxx"

[params.metadata]
ogImage = "images/work1.jpg"
twitterSite = "@username"

# English
[languages.en]
locale = "en-US"
label = "English"
title = "Portfolio"
copyright = "© Kamila Kadyrova"
weight = 1

[languages.en.params]
